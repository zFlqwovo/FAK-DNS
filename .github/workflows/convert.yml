name: Convert Conf Files and Push to Repo

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  convert_conf_files:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install glob2

      - name: Convert Conf Files
        env:
          CN_DNS: ${{ vars.CN_DNS }}
          THE_DNS: ${{ vars.THE_DNS }}
        run: python convert.py

      - name: Check for changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add .
          git commit -m "Convert conf files to txt - $(date +'%Y-%m-%d %H:%M:%S')"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
